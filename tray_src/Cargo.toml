[package]
name = "taskscape-tray"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taskscape-tray"
path = "src/main.rs"

[dependencies]
common = { package = "taskscape-common", path = "../common" }
iced = "0.14"
lucide-icons = { version = "1.14.0", features = ["iced"] }
serde = { version = "1.0", features = ["derive"] }
tray-icon = "0.24.0"
global-hotkey = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Used to read the main display's backing scale factor so the mini window can
# be anchored beneath the (physical-pixel) menu bar icon rect in logical points.
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = "0.3"
