[package]
name = "taskscape-tray"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taskscape-tray"
path = "src/main.rs"

[dependencies]
common = { package = "taskscape-common", path = "../common" }
iced = "0.14"
serde = { version = "1.0", features = ["derive"] }
tray-icon = "0.24.0"
global-hotkey = "0.8"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
# `NSScreen`: read the main display's backing scale factor + height (to anchor
# the mini window under the menu-bar icon and to flip the mouse location).
# `NSView`/`NSWindow`: disable the mini window's drop shadow so its transparent
# rounded corners don't sit inside a square shadow outline, and make it key.
# `NSApplication`: activate the (accessory) app so the mini window can take focus.
# `NSEvent`: read the global mouse location to summon the window at the cursor.
# `NSVisualEffectView` (+ `NSGraphics` for `NSWindowOrderingMode`): the Spotlight-
# style frosted-glass blur, added behind the Iced content view as a sibling in the
# window frame so it sits behind the transparent mini window.
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSView", "NSWindow", "NSResponder", "NSColor", "NSApplication", "NSEvent", "NSVisualEffectView", "NSGraphics"] }
objc2-foundation = "0.3"
# CALayer (cornerRadius + masksToBounds) to clip the window's GPU surface to a
# rounded rect, so the transparent corners don't show square edges.
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }
