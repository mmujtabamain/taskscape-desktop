[package]
name = "taskscape-tray"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taskscape-tray"
path = "src/main.rs"

[dependencies]
common = { package = "taskscape-common", path = "../common" }
iced = "0.14"
lucide-icons = { version = "1.14.0", features = ["iced"] }
serde = { version = "1.0", features = ["derive"] }
tray-icon = "0.24.0"
global-hotkey = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# `NSScreen`: read the main display's backing scale factor to anchor the mini
# window under the (physical-pixel) menu-bar icon rect.
# `NSView`/`NSWindow`: disable the mini window's drop shadow so its transparent
# rounded corners don't sit inside a square shadow outline.
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSView", "NSWindow", "NSResponder", "NSColor"] }
objc2-foundation = "0.3"
# CALayer (cornerRadius + masksToBounds) to clip the window's GPU surface to a
# rounded rect, so the transparent corners don't show square edges.
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }
