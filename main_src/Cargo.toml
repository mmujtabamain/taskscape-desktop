[package]
name = "taskscape"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "taskscape"
path = "src/main.rs"

[dependencies]
common = { package = "taskscape-common", path = "../common" }
iced = "0.14"
serde = { version = "1.0", features = ["derive"] }
muda = "0.19"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
# Custom title bar for the main window. `NSWindow`/`NSView` (+ `NSResponder`,
# which `NSWindow` extends): a transparent system title bar with a full-size
# content view, so we draw our own bar over the native traffic lights.
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
