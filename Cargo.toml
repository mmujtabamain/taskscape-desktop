[package]
name = "Taskscape"
version = "0.1.0"
edition = "2024"

[lib]
name = "taskscape"
path = "src/lib.rs"

[dependencies]
iced = "0.14"
lucide-icons = { version = "1.14.0", features = ["iced"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
muda = "0.19"
rfd = "0.15"
tray-icon = "0.24.0"
global-hotkey = "0.8"
